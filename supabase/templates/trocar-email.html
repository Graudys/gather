<!-- Supabase › Authentication › Emails › Change email address
     Assunto: Confirme seu novo e-mail no Gather -->
<h2>Confirme o novo e-mail</h2>
<p>Clique para confirmar a troca de {{ .Email }} para {{ .NewEmail }}.</p>
<p><a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=email_change"
      style="background:#3d63e0;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">Confirmar novo e-mail</a></p>
