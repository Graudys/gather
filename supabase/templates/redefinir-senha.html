<!-- Supabase › Authentication › Emails › Reset password
     Assunto: Crie uma nova senha no Gather -->
<h2>Nova senha</h2>
<p>Recebemos um pedido para trocar a senha da sua conta. O link vale por 1 hora e só pode ser usado uma vez.</p>
<p><a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery"
      style="background:#3d63e0;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">Criar nova senha</a></p>
<p style="color:#666;font-size:13px">Não foi você? Ignore este e-mail: sua senha continua a mesma.</p>
