name: Backup do banco
# O plano grátis do Supabase não faz backup automático.
# Toda semana: pg_dump, criptografa com GPG e guarda como artefato por 90 dias.
# Segredos no GitHub: SUPABASE_DB_URL (Session pooler, porta 5432) e BACKUP_PASSPHRASE.
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Instala o cliente do Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -so /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump criptografado
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --no-privileges -n public -n private -n auth -n storage -Fc -f db.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o "gather-$STAMP.dump.gpg" db.dump
          rm db.dump
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: gather-backup-${{ env.STAMP }}
          path: gather-*.dump.gpg
          retention-days: 90
